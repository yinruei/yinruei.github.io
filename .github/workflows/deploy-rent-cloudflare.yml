# 租屋比較網站（rent/）自動部署到 Cloudflare Pages
# 觸發：rent/ 底下有任何變動（包括網頁上按「同步」寫回的 listings.json），或在 GitHub → Actions 手動執行
# 需要的 GitHub Secrets（這個 repo → Settings → Secrets and variables → Actions）：
#   CLOUDFLARE_API_TOKEN、CLOUDFLARE_ACCOUNT_ID

name: Deploy rent to Cloudflare Pages

on:
  push:
    branches: [main]
    paths:
      - "rent/**"
      - ".github/workflows/deploy-rent-cloudflare.yml"
  workflow_dispatch:

concurrency:
  group: deploy-rent
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      PROJECT: our-home-rent
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: 檢查 Secrets
        run: |
          missing=""
          [ -z "$CLOUDFLARE_API_TOKEN" ]  && missing="$missing CLOUDFLARE_API_TOKEN"
          [ -z "$CLOUDFLARE_ACCOUNT_ID" ] && missing="$missing CLOUDFLARE_ACCOUNT_ID"
          if [ -n "$missing" ]; then
            echo "::error::缺少 GitHub Secrets:$missing（到 repo → Settings → Secrets and variables → Actions 新增）"
            exit 1
          fi

      - name: 建立 Pages 專案（已存在就略過）
        run: |
          set -euo pipefail
          R=$(curl -sS -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/pages/projects/$PROJECT")
          if [ "$(echo "$R" | jq -r '.success')" = "true" ]; then
            echo "專案 $PROJECT 已存在：https://$(echo "$R" | jq -r '.result.subdomain')"
          else
            npx --yes wrangler@3 pages project create "$PROJECT" --production-branch=main
          fi

      - name: 部署
        run: |
          npx --yes wrangler@3 pages deploy rent \
            --project-name="$PROJECT" --branch=main --commit-dirty=true

      - name: 網址
        run: |
          R=$(curl -sS -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/pages/projects/$PROJECT")
          URL="https://$(echo "$R" | jq -r '.result.subdomain')"
          echo "網站：$URL"
          echo "### 🏠 租屋比較網站已部署：$URL" >> "$GITHUB_STEP_SUMMARY"
